name: Check workflow action SHA pins

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      target-sha:
        description: Target repository commit after OSPO synchronisation
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-action-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.repository }}
          # Sync supplies its post-sync SHA; manual runs use the selected ref's SHA.
          ref: ${{ inputs.target-sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: |
          python -m pip install --only-binary=:all: 'PyYAML==6.0.3'

      # Parse only YAML; never execute scripts or local actions from the target repository.
      - name: Check all target workflow action references
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          import yaml

          REMOTE_PIN = re.compile(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*@[0-9a-fA-F]{40}")
          DOCKER_PIN = re.compile(r"docker://[^\s@]+@sha256:[0-9a-fA-F]{64}")

          def is_pinned(reference):
              return isinstance(reference, str) and (
                  reference.startswith("./")
                  or bool(REMOTE_PIN.fullmatch(reference) or DOCKER_PIN.fullmatch(reference))
              )

          def check_workflow(path):
              if path.is_symlink():
                  return ["workflow files must not be symbolic links"]
              try:
                  document = yaml.safe_load(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeError, yaml.YAMLError) as error:
                  return [f"cannot parse workflow: {error}"]
              if not isinstance(document, dict) or not isinstance(document.get("jobs"), dict):
                  return ["workflow must contain a jobs mapping"]
              errors = []
              for job_name, job in document["jobs"].items():
                  if not isinstance(job, dict):
                      errors.append(f"job {job_name}: expected a mapping")
                      continue
                  steps = job.get("steps", [])
                  if not isinstance(steps, list):
                      errors.append(f"job {job_name}: steps must be a list")
                      steps = []
                  entries = [(f"job {job_name}: reusable workflow", job)]
                  entries.extend((f"job {job_name}, step {index}: action", step) for index, step in enumerate(steps, 1))
                  for location, entry in entries:
                      if not isinstance(entry, dict):
                          errors.append(f"{location}: expected a mapping")
                      elif "uses" in entry and not is_pinned(entry["uses"]):
                          errors.append(f"{location} is not SHA-pinned: {entry['uses']!r}")
              return errors

          def main():
              paths = sorted(path for path in Path(".github/workflows").glob("*") if path.suffix in {".yml", ".yaml"})
              failures = [f"{path}: {error}" for path in paths for error in check_workflow(path)]
              if not paths:
                  failures.append("No workflow YAML files found in .github/workflows.")
              summary = ["# Workflow action SHA pin check", f"Workflows scanned: {len(paths)}", f"Failures: {len(failures)}"]
              summary.extend(f"- {failure}" for failure in failures)
              if not failures:
                  summary.append("All remote actions and reusable workflows are pinned to full commit SHAs; Docker actions use SHA256 digests.")
              report = "\n\n".join(summary) + "\n"
              print(report)
              if summary_path := os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(summary_path, "a", encoding="utf-8") as stream:
                      stream.write(report)
              return int(bool(failures))

          if __name__ == "__main__":
              raise SystemExit(main())
          PY
